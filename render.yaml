services:
  - type: web
    name: youmeng
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @youmeng/web build && pnpm --filter @youmeng/server build
    startCommand: pnpm --filter @youmeng/server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
